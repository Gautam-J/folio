<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://usetrmnl.com/css/latest/plugins.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; }
    .screen, .view { width: 100% !important; height: 100% !important; }
    /* TRMNL's framework pins .layout to a fixed 800x480 box (via --screen-w/
       --screen-h) regardless of the .screen/.view overrides above. Left in
       place, it clips/overflows once fonts are scaled up for larger canvases. */
    .layout { height: 100%; }
    /* TRMNL's framework sizes fonts/gaps for its 800x480 baseline. Scale them
       to the actual rendered canvas so text stays readable at other sizes.
       This applies to every widget fragment dropped into this shell, not
       just weather. */
    :root { --folio-scale: calc({{.Width}} / 800); }
    .value--xxlarge { font-size: calc(96px * var(--folio-scale)); line-height: calc(108px * var(--folio-scale)); }
    .label { font-size: calc(16px * var(--folio-scale)); }
    .layout.gap--large { gap: calc(20px * var(--folio-scale)); }
    /* Shrink-wrap paired stats (rather than stretching across the full row)
       and left-align them. The first column gets a fixed width so the
       second column starts at the same x across every stat row, regardless
       of how long each row's first label is. */
    .columns--stat { gap: 0; justify-content: flex-start; }
    .columns--stat .column { flex: none; width: auto; }
    .columns--stat .column:first-child { width: calc(200px * var(--folio-scale)); }
    .dashboard-corner {
      position: absolute;
      top: calc(16px * var(--folio-scale));
      right: calc(16px * var(--folio-scale));
      text-align: right;
    }
    .dashboard-bottom {
      position: absolute;
      left: calc(16px * var(--folio-scale));
      right: calc(16px * var(--folio-scale));
      bottom: calc(16px * var(--folio-scale));
    }
    .dashboard-progress__row {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--folio-scale));
      margin-top: calc(6px * var(--folio-scale));
    }
    .dashboard-progress__row .label {
      flex: none;
      width: calc(60px * var(--folio-scale));
    }
    .dashboard-progress__row .label:last-child {
      text-align: right;
    }
    .dashboard-progress__track {
      flex: 1;
      height: calc(10px * var(--folio-scale));
      background: #ddd;
      border-radius: calc(5px * var(--folio-scale));
      overflow: hidden;
    }
    .dashboard-progress__fill {
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body class="environment trmnl">
  <div class="screen">
    <div class="view view--full">
      {{.Main}}
      <div class="dashboard-corner">{{.Corner}}</div>
      <div class="dashboard-bottom">{{.Bottom}}</div>
    </div>
  </div>
</body>
</html>
